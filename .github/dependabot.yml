# Dependabot config (SG303 baseline v1). Weekly on Sunday evening, minor and
# patch updates grouped into one PR per ecosystem and merged automatically by
# dependabot-auto-merge.yml once the checks pass. Majors come as separate PRs.
# The 7-day cooldown skips versions younger than a week (mitigates hijacked
# releases); security updates are not delayed.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "22:00"
      timezone: Europe/Zurich
    cooldown:
      default-days: 7
    labels: [dependencies]
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "22:00"
      timezone: Europe/Zurich
    cooldown:
      default-days: 7
    labels: [dependencies]
    groups:
      actions:
        update-types: [minor, patch]
