# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: '07:00'
      timezone: Europe/Zurich
    labels: [dependencies]
    groups:
      # minor + patch updates together in ONE weekly PR; majors stay separate
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: '07:00'
      timezone: Europe/Zurich
    labels: [dependencies]
    # hold back freshly published action releases for a few days
    # (mitigates the moved-tag / supply-chain class of attack)
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ['*']
